services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travel_agent
      POSTGRES_PASSWORD: travel_agent
      POSTGRES_DB: travel_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Override whatever's in .env (meant for plain `make serve`, where
      # "localhost" is correct) with the in-network service names Docker's
      # own DNS resolves - postgres/redis below are container hostnames,
      # not reachable from outside this compose network.
      DATABASE_URL: postgresql://travel_agent:travel_agent@postgres:5432/travel_agent
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      # Same override reasoning as above: .env's default (:5173, the Vite
      # dev server) is wrong here — the Dockerized frontend this backend's
      # password-reset/share-link emails and URLs actually need to point at
      # is served on :8080 (frontend service's docker-compose port mapping).
      FRONTEND_BASE_URL: http://localhost:8080
      # JSON logs here regardless of what .env has for local `make serve`
      # (console, human-readable) - a container's logs are meant to be
      # aggregated/queried, not read directly off a terminal.
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend_output:/app/output

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes this into the JS bundle at build time (see
        # frontend/Dockerfile) - it must be a URL the BROWSER can reach
        # (the host's mapped port), not the in-network service name
        # `backend`, which only resolves inside Docker's own network.
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Week 19 observability. Both scrape/read from the backend's real
  # /metrics endpoint - nothing here is faked or pre-seeded.
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      # One mount, not two: a second bind mount nested inside this one
      # (e.g. at .../dashboards/json) fails outright - Docker can't create
      # a mountpoint inside an already-read-only parent mount. The
      # dashboard JSON lives inside provisioning/ itself instead (see
      # observability/grafana/provisioning/dashboards/json/), so this one
      # mount covers datasources, the dashboard provider config, and the
      # dashboard JSON together.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_output:
  prometheus_data:
  grafana_data:
