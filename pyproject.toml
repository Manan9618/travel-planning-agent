[tool.poetry]
name = "travel-agent"
version = "0.1.0"
description = "Autonomous AI Travel Planning Agent"
authors = ["Manan Modi"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.9"
python-dotenv = "^1.0"
openai = "^1.51"
langchain = "^0.3"
langchain-openai = "^0.2"
langgraph = "^0.2"
langgraph-checkpoint-sqlite = "^2.0"
tenacity = "^9.0"
requests = "^2.32"
redis = "^5.1"
scikit-learn = "^1.5"
folium = "^0.18"
weasyprint = "^69.0"
qrcode = "^8.2"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.52.0"}
slowapi = "^0.1.10"
langgraph-checkpoint-postgres = "^2.0.25"
psycopg = {version = "^3.3.4", extras = ["binary"]}
# Runtime dependency, not just a testing tool: generate_pdf's map-thumbnail
# step (Week 13/14) imports playwright.sync_api directly in production code
# (travel_map_generator.py's render_thumbnail_png). Found live-testing the
# Week 18 Docker build - a "prod image only needs main deps" install would
# have silently dropped map thumbnails from every generated PDF (caught
# gracefully, not a crash, but a real regression from documented Week 13/14
# behavior). pytest-playwright (E2E-suite-only) correctly stays in dev deps.
playwright = "^1.62.0"
structlog = "^26.1.0"
prometheus-client = "^0.26.0"
sentry-sdk = "^2.66.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
black = "^24.10"
ruff = "^0.7"
pre-commit = "^4.0"
responses = "^0.25"
pypdf = "^6.14.2"
httpx = "^0.28.1"
pytest-asyncio = "^1.4.0"
pytest-playwright = "^0.8.0"
locust = "^2.46.3"
mutmut = "^3.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# tests/e2e needs a real browser plus real backend/frontend subprocesses
# (see tests/e2e/conftest.py) - too slow/heavy for the default `pytest`/
# `make test` loop, so it's deliberately left out of testpaths (only
# applies when no path is given on the command line) and run separately
# via `make e2e`, which passes tests/e2e explicitly.
testpaths = ["tests/unit", "tests/integration", "tests/api"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mutmut]
# Scoped to the algorithm-dense modules (real branching logic - clustering,
# constraint search, scoring) where a surviving mutant would actually
# indicate a real test-quality gap, rather than the whole tree: the many
# thin HTTP-tool-wrapper modules (flight/hotel/attraction search, etc.)
# would multiply mutant count for little signal, since their own logic is
# mostly "call the API, map the response" already covered by every
# error-path/fallback test written for them. See README's Week 17 section
# for the mutation score and what surviving mutants (if any) revealed.
only_mutate = [
    "src/travel_agent/tools/route_optimizer.py",
    "src/travel_agent/tools/budget_optimizer.py",
    "src/travel_agent/tools/conflict_detector.py",
    "src/travel_agent/tools/geo_clustering.py",
    "src/travel_agent/tools/multi_day_optimizer.py",
    "src/travel_agent/tools/weather_matcher.py",
]
# tests/unit only (fast, deterministic, no network) - not tests/integration
# or tests/api, which would multiply per-mutant runtime for no extra
# coverage of these particular modules.
pytest_add_cli_args_test_selection = ["tests/unit"]
