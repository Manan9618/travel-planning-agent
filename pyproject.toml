[tool.poetry]
name = "travel-agent"
version = "0.1.0"
description = "Autonomous AI Travel Planning Agent"
authors = ["Manan Modi"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.9"
python-dotenv = "^1.0"
openai = "^1.51"
langchain = "^0.3"
langchain-openai = "^0.2"
langgraph = "^0.2"
langgraph-checkpoint-sqlite = "^2.0"
tenacity = "^9.0"
requests = "^2.32"
redis = "^5.1"
scikit-learn = "^1.5"
folium = "^0.18"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
black = "^24.10"
ruff = "^0.7"
pre-commit = "^4.0"
responses = "^0.25"
playwright = "^1.62.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
