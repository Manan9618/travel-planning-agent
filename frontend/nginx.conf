server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every real route is client-side (React Router-free here,
    # but the same principle applies to any deep link/refresh) - anything
    # that isn't a real static asset falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Fonts/JS/CSS are content-hashed by Vite - safe to cache aggressively.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
